<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1f2a24" />
  <title>崔艺潆 · 美西行李清单</title>
  <style>
    :root {
      --bg: #f4efe6;
      --bg-2: #ebe3d4;
      --paper: #fffaf2;
      --ink: #1f2a24;
      --muted: #6b6458;
      --line: #e0d6c6;
      --buy: #c45c26;
      --buy-bg: #fbe8d8;
      --pack: #3d6b4f;
      --pack-bg: #e4efe6;
      --done: #8a8478;
      --skip: #9a9084;
      --danger: #9b2c2c;
      --shadow: 0 10px 30px rgba(31, 42, 36, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-padding-top: 150px; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #f8e7c9 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 120px; }
    header.hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px 20px 18px;
      box-shadow: var(--shadow);
    }
    .kicker { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
    h1 { font-size: 28px; margin: 6px 0 8px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    .stat {
      background: var(--bg);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat b { display: block; font-size: 22px; line-height: 1.2; }
    .stat span { font-size: 11px; color: var(--muted); }
    .bar { height: 8px; background: var(--bg-2); border-radius: 99px; margin-top: 14px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3d6b4f, #c9a227); transition: width .25s ease; }
    .toolbar {
      position: sticky; top: 0; z-index: 8;
      background: rgba(244, 239, 230, 0.96);
      backdrop-filter: blur(12px);
      margin: 14px -16px 0;
      padding: 10px 16px 10px;
      border-bottom: 1px solid var(--line);
    }
    .filters, .bags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .chip, .bag {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.on, .bag.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 16px;
      margin-top: 4px;
    }
    .hint {
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 16px;
      background: #f7ead4;
      color: #5b4630;
      font-size: 13px;
      line-height: 1.55;
    }
    .group {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      margin-top: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .group-h {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 12px;
      background: transparent; border: 0; text-align: left; cursor: pointer;
    }
    .group-h h2 { margin: 0; font-size: 18px; }
    .group-h small { color: var(--muted); display: block; margin-top: 4px; font-size: 12px; line-height: 1.45; }
    .count { font-size: 12px; color: var(--muted); }
    .items { padding: 0 10px 10px; }
    .item {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 14px 8px;
      border-top: 1px solid var(--line);
      scroll-margin-top: 150px;
      cursor: pointer;
    }
    .item:active { background: #f7f1e6; }
    .item.done .name { color: var(--done); text-decoration: line-through; }
    .item.skip { opacity: .55; }
    .check {
      width: 28px; height: 28px; margin-top: 1px;
      border-radius: 9px; border: 1.5px solid #b7b0a4;
      background: #fff; cursor: pointer;
      display: grid; place-items: center;
      font-size: 16px; pointer-events: none;
    }
    .item.done .check { background: #3d6b4f; border-color: #3d6b4f; color: #fff; }
    .name { font-size: 15px; font-weight: 560; }
    .why { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      font-size: 11px; border-radius: 999px; padding: 3px 8px;
      background: var(--bg-2); color: var(--muted);
    }
    .tag.buy { background: var(--buy-bg); color: var(--buy); }
    .tag.pack { background: var(--pack-bg); color: var(--pack); }
    .tag.car { background: #efe4c8; color: #7a5b16; }
    .actions { display: flex; flex-direction: column; gap: 6px; }
    .mini {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      font-size: 11px; padding: 4px 8px; cursor: pointer; color: var(--muted);
    }
    .mini.on-buy { background: var(--buy-bg); color: var(--buy); border-color: #efc7a8; }
    .mini.on-skip { background: #eee; color: #666; }
    .add {
      margin-top: 16px;
      display: flex; gap: 8px;
    }
    .add input, .add select {
      border: 1px solid var(--line); background: var(--paper); border-radius: 12px;
      padding: 11px 12px; font-size: 15px;
    }
    .add input { flex: 1; }
    .add button, .reset {
      border: 0; background: var(--ink); color: #fff; border-radius: 12px;
      padding: 11px 14px; cursor: pointer;
    }
    .reset { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-top: 10px; }
    .footer-note { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.5; }
    @media (max-width: 520px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="kicker">US West · 9/25–10/6 · 只列你的东西</div>
      <h1>行李清单</h1>
      <p class="sub">点左边方框打勾。还没买的先标「待采购」，确定不带就点「不带」。进度存在这台手机/电脑里，关掉也不会丢。</p>
      <div class="stats">
        <div class="stat"><b id="nAll">0</b><span>全部</span></div>
        <div class="stat"><b id="nBuy">0</b><span>待采购</span></div>
        <div class="stat"><b id="nOpen">0</b><span>未完成</span></div>
        <div class="stat"><b id="nDone">0</b><span>已打勾</span></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </header>

    <div class="toolbar">
      <div class="filters" id="filters"></div>
      <div class="bags" id="bags"></div>
      <input class="search" id="q" placeholder="搜：护照、羽绒、电解质…" />
    </div>

    <div class="hint">
      打勾顺序建议：先清掉「待采购」，再按随身 → 托运 → 车上装箱。蛇口海天 9/25 早上 8:00 前要办完值机托运。
    </div>

    <div id="app"></div>

    <div class="add">
      <input id="newName" placeholder="自己加一项，例如：压缩袋" />
      <select id="newBag">
        <option value="carry">随身</option>
        <option value="checked">托运</option>
        <option value="car">车上</option>
      </select>
      <button id="addBtn">加上</button>
    </div>
    <button class="reset" id="resetBtn">清空勾选，恢复默认清单</button>
    <p class="footer-note">默认只列崔艺潆自己要带/要买的。相机、转换插头、大药包、美国电话卡按你们之前的分工，不出现在这里。</p>
  </div>

const DEFAULTS = {};
GROUPS.forEach((g) => g.items.forEach((it) => {
  DEFAULTS[it[0]] = { state: it[3], custom: false };
}));

function load() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; }
  catch { return { ...DEFAULTS }; }
}
function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

let store = load();
let filter = "open";
let bag = "all";
let query = "";

const filtersEl = document.getElementById("filters");
const bagsEl = document.getElementById("bags");
const app = document.getElementById("app");

function chips() {
  const fs = [
    ["open", "未完成"],
    ["buy", "待采购"],
    ["all", "全部"],
    ["done", "已打勾"],
    ["skip", "不带"]
  ];
  filtersEl.innerHTML = fs.map(([k, l]) =>
    `<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`
  ).join("");
  bagsEl.innerHTML = [["all","全部位置"],["carry","随身"],["checked","托运"],["car","车上"]]
    .map(([k,l]) => `<button class="bag ${bag===k?"on":""}" data-b="${k}">${l}</button>`).join("");
}

function allItems() {
  const extra = Object.entries(store).filter(([id, v]) => v.custom).map(([id, v]) => ({
    id, name: v.name, bag: v.bag, init: "pack", why: "", group: "custom"
  }));
  const base = GROUPS.flatMap((g) => g.items.map((it) => ({
    id: it[0], name: it[1], bag: it[2], init: it[3], why: it[4] || "", group: g.key
  })));
  return base.concat(extra);
}

function visible(item) {
  const st = (store[item.id] || {}).state || item.init;
  if (bag !== "all" && item.bag !== bag) return false;
  if (query && !item.name.toLowerCase().includes(query) && !(item.why||"").toLowerCase().includes(query)) return false;
  if (filter === "all") return true;
  if (filter === "open") return st === "buy" || st === "pack";
  return st === filter;
}

function setState(id, state) {
  store[id] = { ...(store[id] || {}), state };
  save(store);
  render();
}

function toggleDone(item) {
  const st = (store[item.id] || {}).state || item.init;
  if (st === "done") setState(item.id, item.init === "done" ? "pack" : (item.init === "skip" ? "pack" : item.init));
  else if (st === "skip") setState(item.id, "done");
  else setState(item.id, "done");
}

function render() {
  chips();
  const items = allItems();
  const counts = { all: 0, buy: 0, pack: 0, done: 0, skip: 0 };
  items.forEach((it) => {
    const st = (store[it.id] || {}).state || it.init;
    counts[st] = (counts[st] || 0) + 1;
    counts.all++;
  });
  document.getElementById("nAll").textContent = counts.all;
  document.getElementById("nBuy").textContent = counts.buy;
  document.getElementById("nOpen").textContent = counts.buy + counts.pack;
  document.getElementById("nDone").textContent = counts.done;
  const denom = Math.max(1, counts.all - counts.skip);
  document.getElementById("bar").style.width = Math.round(counts.done / denom * 100) + "%";

  const customGroup = {
    key: "custom",
    title: "我自己加的",
    note: "从下面输入框加进来的。",
    items: items.filter((it) => it.group === "custom").map((it) => [it.id, it.name, it.bag, "pack", ""])
  };
  const groups = GROUPS.concat(customGroup.items.length ? [customGroup] : []);

  app.innerHTML = groups.map((g) => {
    const mapped = g.items.map((it) => ({
      id: it[0], name: it[1], bag: it[2], init: it[3], why: it[4] || "", group: g.key
    })).filter(visible);
    if (!mapped.length) return "";
    const done = mapped.filter((it) => ((store[it.id]||{}).state || it.init) === "done").length;
    return `<section class="group">
      <button class="group-h" data-toggle="${g.key}">
        <div>
          <h2>${g.title}</h2>
          <small>${g.note}</small>
        </div>
        <div class="count">${done}/${mapped.length}</div>
      </button>
      <div class="items" id="g-${g.key}">
        ${mapped.map((it) => {
          const st = (store[it.id] || {}).state || it.init;
          return `<div class="item ${st}" data-done="${it.id}">
            <div class="check">${st==="done"?"✓":""}</div>
            <div>
              <div class="name">${it.name}</div>
              ${it.why ? `<div class="why">${it.why}</div>` : ""}
              <div class="tags">
                <span class="tag ${it.bag==="car"?"car":""}">${BAG[it.bag]}</span>
                <span class="tag ${st}">${STATE[st]}</span>
              </div>
            </div>
            <div class="actions">
              <button class="mini ${st==="buy"?"on-buy":""}" data-buy="${it.id}">待采购</button>
              <button class="mini ${st==="skip"?"on-skip":""}" data-skip="${it.id}">不带</button>
            </div>
          </div>`;
        }).join("")}
      </div>
    </section>`;
  }).join("");
}

filtersEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-f]");
  if (!b) return;
  filter = b.dataset.f;
  render();
});
bagsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-b]");
  if (!b) return;
  bag = b.dataset.b;
  render();
});
document.getElementById("q").addEventListener("input", (e) => {
  query = e.target.value.trim().toLowerCase();
  render();
});
app.addEventListener("click", (e) => {
  const buy = e.target.closest("[data-buy]");
  const skip = e.target.closest("[data-skip]");
  const row = e.target.closest("[data-done]");
  if (buy) {
    const id = buy.dataset.buy;
    const st = (store[id] || {}).state;
    setState(id, st === "buy" ? "pack" : "buy");
    return;
  }
  if (skip) {
    const id = skip.dataset.skip;
    const st = (store[id] || {}).state;
    setState(id, st === "skip" ? "pack" : "skip");
    return;
  }
  if (row) {
    const item = allItems().find((x) => x.id === row.dataset.done);
    if (item) toggleDone(item);
  }
});
document.getElementById("addBtn").addEventListener("click", () => {
  const name = document.getElementById("newName").value.trim();
  if (!name) return;
  const id = "c-" + Date.now();
  store[id] = { state: "pack", custom: true, name, bag: document.getElementById("newBag").value };
  save(store);
  document.getElementById("newName").value = "";
  filter = "open";
  render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("会清掉所有勾选和自己加的项，确定？")) return;
  store = { ...DEFAULTS };
  save(store);
  render();
});
render();
</script>
